[project]
name = "deixis"
version = "0.1.0"
description = "Tell any robot where: turn 'here', 'that one' and 'this big', plus pointing, into a place a robot can act on"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Rahul Jeyaraj" }]
keywords = ["deixis", "pointing", "multimodal", "robotics", "speech", "gesture", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
]

[project.urls]
Repository = "https://github.com/rahuljeyaraj/deixis"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deixis"]

[tool.uv]
# Use a uv-managed CPython, never a Python that happens to be first on PATH.
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
